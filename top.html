<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sand</title>
<style>
  * { touch-action: none; pointer-events: none; }
  #btn { pointer-events: auto; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ED1C24; }
  #box {
    position: fixed;
    width: 50vw;
    height: 50vw;
    left: 0;
    top: 0;
    background: url('1863259_0792e.gif') center/cover no-repeat;
    background-color: #ED1C24;
    transform-origin: center center;
  }
  #debug {
    position: fixed;
    top: 16px; right: 16px;
    color: white;
    font-family: monospace;
    font-size: 12px;
    z-index: 10;
    white-space: pre;
  }
  #btn {
    position: fixed;
    bottom: 40px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.1);
    border: 1px solid white;
    color: white;
    font-family: monospace;
    font-size: 15px;
    padding: 14px 28px;
    border-radius: 8px;
    cursor: pointer;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="box"></div>
<div id="debug">waiting...</div>
<button id="btn">tap to enable</button>
<script>
  const box   = document.getElementById('box');
  const debug = document.getElementById('debug');
  const btn   = document.getElementById('btn');

  let targetAngle = 0, smoothAngle = 0;

  function lerpAngle(a, b, t) {
    return a + (((b - a + 540) % 360) - 180) * t;
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function para(t) { return t * t; }
  // overshoot then settle: goes past target then comes back
  // accelerating exit: slow start, fast exit off screen
  function jumpExit(t, from, to) {
    const e = 1 - Math.pow(1 - t, 6);
    return from + (to - from) * e;
  }

  function getState(a) {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const s  = vw * 0.5;
    const A = -s;
    const B = 0.8*vh - s;
    const C = vh;
    const D = 0.2*vh;

    if (a >= 25  && a <= 65)  return [lerp(C, A, (a-25)/40),  s, true, true];
    if (a >= 205 && a <= 245) return [lerp(A, C, (a-205)/40), 0, true, false];
    return [A, 0, false, true];
  }

  function loop() {
    smoothAngle = lerpAngle(smoothAngle, targetAngle, 0.1);
    const a = ((smoothAngle % 360) + 360) % 360;
    const [top, left, visible, flipped] = getState(a);
    box.style.top     = top + 'px';
    box.style.left    = left + 'px';
    box.style.opacity = visible ? '1' : '0';
    box.style.transform = flipped ? 'rotate(90deg) scaleY(-1)' : 'rotate(90deg) scaleX(-1)';
    debug.textContent = `angle: ${a.toFixed(1)}°\ntop: ${top.toFixed(0)}px`;
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);

  function handleMotion(e) {
    if (btn.parentNode) btn.remove();
    const g = e.accelerationIncludingGravity;
    if (!g) return;
    let x = g.x ?? 0, y = g.y ?? 0, z = g.z ?? 0;
    const inPlane = Math.sqrt(x*x + y*y);
    let angle = Math.atan2(x, -y) * (180 / Math.PI);
    if (z > 0 && inPlane < 3) angle += 180;
    targetAngle = angle;
  }

  function startSensors() {
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission()
        .then(state => {
          if (state === 'granted') window.addEventListener('devicemotion', handleMotion, true);
  document.addEventListener('touchstart', e => e.preventDefault(), {passive: false});
  document.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
          debug.textContent = 'permission: ' + state;
        })
        .catch(err => debug.textContent = 'err: ' + err);
    } else {
      window.addEventListener('devicemotion', handleMotion, true);
  document.addEventListener('touchstart', e => e.preventDefault(), {passive: false});
  document.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
    }
  }

  btn.addEventListener('click', startSensors);
  window.addEventListener('devicemotion', handleMotion, true);
  document.addEventListener('touchstart', e => e.preventDefault(), {passive: false});
  document.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
</script>
</body>
</html>
